name: Paper rotation agent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-rotation-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm start
      - name: Persist paper state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "paper-agent[bot]"
          git config user.email "paper-agent@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update paper trading state"
          git push
