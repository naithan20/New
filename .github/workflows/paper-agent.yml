name: Paper rotation agent

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-rotation-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Run six scans at 10-minute intervals
        shell: bash
        run: |
          git config user.name "paper-agent[bot]"
          git config user.email "paper-agent@users.noreply.github.com"

          for i in 1 2 3 4 5 6; do
            echo "=== Scan $i/6 at $(date -u +%FT%TZ) ==="
            npm start

            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit -m "chore: update paper trading state (scan $i)"
              git push
            else
              echo "No state change on scan $i"
            fi

            if [ "$i" -lt 6 ]; then
              sleep 600
            fi
          done
